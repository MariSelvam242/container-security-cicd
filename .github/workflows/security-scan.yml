name: Container Security CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  security-scan:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Build Docker image
        run: |
          docker build -t container-security-app:${{ github.sha }} .

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: container-security-app:${{ github.sha }}
          format: table
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'
          
        - name: Login to Docker Hub
          uses: docker/login-action@v3    
          with:
           username: ${{ secrets.DOCKERHUB_USERNAME }}
           password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Tag Docker image
          run: docker tag container-security-app:${{ github.sha }} mariselvam01/container-security-cicd:${{ github.sha }}

        - name: Push Docker image to Docker Hub
          run: docker push mariselvam01/container-security-cicd:${{ github.sha }}
